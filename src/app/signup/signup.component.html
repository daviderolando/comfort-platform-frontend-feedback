<div class="row" *ngIf="signupError">
  <div class="col-md-6 offset-md-3">
    <div class="alert alert-danger text-center">{{ signupErrorMessage }}</div>
  </div>
</div>

<!-- SignUp via username, email and password -->
<div class="row mt-3" *ngIf="!confirmUser">
  <div class="col-md-6 offset-md-3">

    <button class="btn btn-primary mt-1" type="button" (click)="onTestObs()">Test Observable</button>
    <button class="btn btn-primary mt-1" type="button" (click)="onTestSignUp()">Test Sign Up</button>

    <!-- <div class="col-xs-12 col-md-6 col-md-offset-4 text-center"> -->
    <!-- <div class="col-xs-12 col-sm-10 col-md-6 col-sm-offset-1 col-md-offset-3"> -->
      <h4>Sign Up with username and password</h4>

      <form class="text-center jumbotron" (ngSubmit)="onSubmitSignUp(signupForm)" #signupForm="ngForm">
        <div class="form-group">
          <label
            for="username"
            class="control-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            ngModel
            class="form-control text-center"
            required>
        </div>
        <div class="form-group">
          <label
            for="email"
            class="control-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            ngModel
            class="form-control text-center"
            required
            email>
        </div>
        <div class="form-group">
          <label
            for="password"
            class="control-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            ngModel
            class="form-control text-center"
            required>
        </div>
        <div class="form-group">
          <label
            for="confirmPassword"
            class="control-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            ngModel
            class="form-control text-center"
            required>
        </div>
        <div *ngIf="signupForm.value.password !== signupForm.value.confirmPassword">Passwords do not match!</div>
        <button class="btn btn-primary mt-1" type="submit"
                [disabled]="(signupForm.value.password !== signupForm.value.confirmPassword) || signupForm.invalid">Submit
        </button>
        <button class="btn btn-secondary mt-1" type="button" (click)="onConfirmToggle()">Confirm with code</button>
      </form>

    <!-- </div> -->
  </div>
</div>

<!-- SignUp via signup code -->
<div class="row" *ngIf="!confirmUser">
  <hr class="mt-3">

  <!-- <div class="col-xs-12 col-md-6 col-md-offset-4 mt-3"> -->
  <div class="col-md-6 offset-md-3">
    <h4>Sign Up with code</h4>
    <div class="alert alert-warning" *ngIf="!isValid">
      <p>Code not valid. <br>Please check your code and try again.</p>
    </div>

    <form class="text-center jumbotron" #verifyForm="ngForm" (ngSubmit)="onSubmit(verifyForm)">
      <div class="form-group">
        <label for="signupcode">Please provide the signup code</label>
        <input
          type="text"
          id="signupcode"
          class="form-control"
          ngModel
          name="signupcode"
          required
        />
      </div>
      <div>
        <button
          class="btn btn-primary mt-1"
          type="submit"
          [disabled]="!verifyForm.valid || !isValid"
        >Verify</button>
      </div>
    </form>

  </div>
</div>

<!-- Confirm User (Code via email) -->
<div class="row mt-3" *ngIf="confirmUser">
  <div class="col-md-6 offset-md-3" *ngIf="confirmUser">
    <h4>Confirm</h4>
    <p>Please confirm your account with your username and the code you have received via email</p>
    <form #confirmForm="ngForm" (ngSubmit)="onConfirm(confirmForm.value)" class="jumbotron text-center">
      <div class="form-group">
        <label
          for="usrName"
          class="control-label">Username</label>
        <input
          type="text"
          id="usrName"
          name="usrName"
          ngModel
          class="form-control text-center"
          required>
      </div>
      <div class="form-group">
        <label
          for="validationCode"
          class="control-label">Validation Code</label>
        <input
          type="text"
          id="validationCode"
          name="validationCode"
          ngModel
          class="form-control text-center"
          required>
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="confirmForm.invalid">Confirm your Account</button>
    </form>
  </div>
</div>
